<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gia Huy Shop - Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen">

  <!-- =========================
       ĐĂNG NHẬP ADMIN
  ========================== -->
  <div id="loginBox" class="min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6">

      <div class="text-center mb-6">

        <h1 class="text-3xl font-bold text-cyan-400">
          Gia Huy Shop
        </h1>

        <p class="text-slate-400 mt-2">
          Đăng nhập quản trị
        </p>

      </div>

      <div class="space-y-4">

        <div>
          <label class="block text-sm text-slate-400 mb-1">
            Tài khoản
          </label>

          <input
            id="username"
            type="text"
            placeholder="Nhập tài khoản"
            class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-cyan-400"
          >
        </div>

        <div>
          <label class="block text-sm text-slate-400 mb-1">
            Mật khẩu
          </label>

          <input
            id="password"
            type="password"
            placeholder="Nhập mật khẩu"
            class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-cyan-400"
          >
        </div>

        <button
          onclick="adminLogin()"
          class="w-full py-3 rounded-xl bg-cyan-500 text-slate-950 font-bold hover:bg-cyan-400"
        >
          Đăng nhập Admin
        </button>

        <p id="loginMessage"
           class="text-center text-sm text-red-400">
        </p>

      </div>

    </div>

  </div>


  <!-- =========================
       TRANG ADMIN
  ========================== -->
  <div id="adminBox" class="hidden">

    <div class="max-w-6xl mx-auto px-4 py-8">

      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">

        <div>

          <h1 class="text-3xl font-bold text-cyan-400">
            Gia Huy Shop
          </h1>

          <p class="text-slate-400 mt-1">
            Quản trị nạp tiền
          </p>

        </div>

        <div class="flex gap-2">

          <button
            onclick="loadTopups()"
            class="px-4 py-2 rounded-lg bg-cyan-500 text-black font-bold hover:bg-cyan-400"
          >
            🔄 Làm mới
          </button>

          <button
            onclick="logoutAdmin()"
            class="px-4 py-2 rounded-lg bg-red-500/20 text-red-400 border border-red-500/30"
          >
            Đăng xuất
          </button>

        </div>

      </div>


      <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">

        <div class="p-5 border-b border-slate-800">

          <h2 class="text-xl font-bold">
            Yêu cầu nạp tiền
          </h2>

          <p id="message" class="text-sm text-slate-400 mt-2">
            Đang kiểm tra...
          </p>

        </div>


        <div class="overflow-x-auto">

          <table class="w-full text-sm">

            <thead class="bg-slate-800">

              <tr>

                <th class="p-4 text-left">ID</th>

                <th class="p-4 text-left">
                  Tài khoản
                </th>

                <th class="p-4 text-left">
                  Email
                </th>

                <th class="p-4 text-left">
                  Số tiền
                </th>

                <th class="p-4 text-left">
                  Nội dung
                </th>

                <th class="p-4 text-left">
                  Trạng thái
                </th>

                <th class="p-4 text-left">
                  Thao tác
                </th>

              </tr>

            </thead>

            <tbody id="topupList"></tbody>

          </table>

        </div>

      </div>

    </div>

  </div>


<script>

const API = "https://gia-huy.onrender.com";


/* =========================
   ĐĂNG NHẬP ADMIN
========================= */

async function adminLogin() {

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "";

  if (!username || !password) {

    message.textContent =
      "Vui lòng nhập tài khoản và mật khẩu";

    return;
  }

  try {

    const response = await fetch(
      API + "/api/login",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        credentials: "include",

        body: JSON.stringify({
          username,
          password
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {

      message.textContent =
        data.message || "Đăng nhập thất bại";

      return;
    }


    if (data.user.role !== "admin") {

      message.textContent =
        "Tài khoản này không có quyền admin";

      return;
    }


    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("adminBox")
      .classList.remove("hidden");

    loadTopups();

  } catch (error) {

    console.error(error);

    message.textContent =
      "Không kết nối được tới server";

  }

}


/* =========================
   TẢI GIAO DỊCH
========================= */

async function loadTopups() {

  const message =
    document.getElementById("message");

  const list =
    document.getElementById("topupList");

  message.textContent =
    "Đang tải dữ liệu...";

  list.innerHTML = "";


  try {

    const response = await fetch(
      API + "/api/admin/topups",
      {
        credentials: "include"
      }
    );

    const data = await response.json();


    if (!response.ok || !data.success) {

      message.textContent =
        data.message || "Không thể tải dữ liệu";

      return;
    }


    message.textContent =
      `Có ${data.transactions.length} giao dịch`;


    if (data.transactions.length === 0) {

      list.innerHTML = `
        <tr>
          <td colspan="7"
              class="p-8 text-center text-slate-500">
            Chưa có giao dịch nạp tiền
          </td>
        </tr>
      `;

      return;
    }


    data.transactions.forEach(item => {

      const pending =
        item.status === "Chờ xử lý";


      const tr =
        document.createElement("tr");

      tr.className =
        "border-t border-slate-800";


      tr.innerHTML = `

        <td class="p-4">
          ${item.id}
        </td>

        <td class="p-4 font-bold text-cyan-400">
          ${item.username}
        </td>

        <td class="p-4 text-slate-300">
          ${item.email || ""}
        </td>

        <td class="p-4 font-bold text-emerald-400">
          ${formatMoney(item.amount)}
        </td>

        <td class="p-4 text-slate-400">
          ${item.note || ""}
        </td>

        <td class="p-4">

          ${
            pending

            ? `
              <span class="px-3 py-1 rounded-full bg-yellow-500/20 text-yellow-400">
                Chờ xử lý
              </span>
            `

            : `
              <span class="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400">
                ${item.status}
              </span>
            `
          }

        </td>

        <td class="p-4">

          ${
            pending

            ? `
              <button
                onclick="approveTopup(${item.id})"
                class="px-4 py-2 rounded-lg bg-emerald-500 text-black font-bold hover:bg-emerald-400">
                ✓ Duyệt
              </button>
            `

            : `
              <span class="text-slate-500">
                Đã xử lý
              </span>
            `
          }

        </td>

      `;

      list.appendChild(tr);

    });


  } catch (error) {

    console.error(error);

    message.textContent =
      "Không kết nối được tới server";

  }

}


/* =========================
   DUYỆT NẠP TIỀN
========================= */

async function approveTopup(id) {

  const ok =
    confirm(
      "Bạn có chắc muốn duyệt giao dịch #" +
      id +
      "?"
    );

  if (!ok) return;


  try {

    const response = await fetch(
      API + "/api/admin/topups/" + id + "/approve",
      {
        method: "POST",
        credentials: "include"
      }
    );


    const data =
      await response.json();


    if (!response.ok || !data.success) {

      alert(
        data.message ||
        "Không thể duyệt giao dịch"
      );

      return;
    }


    alert(
      "Đã duyệt nạp tiền thành công!"
    );


    loadTopups();


  } catch (error) {

    console.error(error);

    alert(
      "Không kết nối được tới server"
    );

  }

}


/* =========================
   ĐĂNG XUẤT
========================= */

async function logoutAdmin() {

  try {

    await fetch(
      API + "/api/logout",
      {
        method: "POST",
        credentials: "include"
      }
    );

  } catch (error) {}

  document.getElementById("adminBox")
    .classList.add("hidden");

  document.getElementById("loginBox")
    .classList.remove("hidden");

}


/* =========================
   FORMAT TIỀN
========================= */

function formatMoney(number) {

  return Number(number)
    .toLocaleString("vi-VN") + "đ";

}

</script>
  <!-- ========================= -->
<!-- QUẢN LÝ TÀI KHOẢN -->
<!-- ========================= -->

<div style="margin-top:40px;">
  <h2>👥 Quản lý tài khoản</h2>

  <button onclick="loadAdminUsers()"
          style="margin:10px 0;padding:8px 14px;cursor:pointer;">
    🔄 Làm mới
  </button>

  <div style="overflow-x:auto;">
    <table border="1"
           cellpadding="10"
           cellspacing="0"
           style="width:100%;border-collapse:collapse;">
      <thead>
        <tr>
          <th>ID</th>
          <th>Tài khoản</th>
          <th>Email</th>
          <th>Số dư</th>
          <th>Quyền</th>
          <th>Thao tác</th>
          <th>Ngày tạo</th>
        </tr>
      </thead>

      <tbody id="adminUsersTableBody">
        <tr>
          <td colspan="6">Đang tải...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
async function loadAdminUsers() {
  const tbody = document.getElementById("adminUsersTableBody");

  try {
    const res = await fetch(
      "https://gia-huy.onrender.com/api/admin/users",
      {
        method: "GET",
        credentials: "include"
      }
    );

    const data = await res.json();

    if (!data.success) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6">${data.message || "Không thể tải tài khoản"}</td>
        </tr>
      `;
      return;
    }

    if (!data.users || data.users.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6">Chưa có tài khoản</td>
        </tr>
      `;
      return;
    }

    tbody.innerHTML = data.users.map(user => `
      <tr>
        <td>${user.id}</td>
        <td>${user.username}</td>
        <td>${user.email || ""}</td>
        <td>${Number(user.balance || 0).toLocaleString("vi-VN")}đ</td>
        <td>${user.role}</td>
        <td>
  <button
    onclick="editUserBalance(${user.id}, '${user.username}')"
    style="padding:6px 10px;cursor:pointer;">
    💰 Chỉnh số dư
  </button>
</td>
        <td>
          ${user.created_at
            ? new Date(user.created_at).toLocaleString("vi-VN")
            : ""}
        </td>
      </tr>
    `).join("");

  } catch (error) {
    console.error(error);

    tbody.innerHTML = `
      <tr>
        <td colspan="6">
          ❌ Không thể kết nối backend
        </td>
      </tr>
    `;
  }
}
  async function editUserBalance(userId, username) {
  const input = prompt(
    `Nhập số dư mới cho tài khoản "${username}":`
  );

  if (input === null) return;

  const amount = Number(input);

  if (!Number.isFinite(amount) || amount < 0) {
    alert("❌ Số dư không hợp lệ");
    return;
  }

  const ok = confirm(
    `Đặt số dư của "${username}" thành ${Math.floor(amount).toLocaleString("vi-VN")}đ?`
  );

  if (!ok) return;

  try {
    const res = await fetch(
      `https://gia-huy.onrender.com/api/admin/users/${userId}/balance`,
      {
        method: "POST",
        credentials: "include",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          amount: Math.floor(amount)
        })
      }
    );

    const data = await res.json();

    if (!data.success) {
      alert("❌ " + (data.message || "Không thể chỉnh số dư"));
      return;
    }

    alert(
      `✅ Đã cập nhật số dư của ${username}`
    );

    loadAdminUsers();

  } catch (error) {
    console.error(error);
    alert("❌ Không thể kết nối backend");
  }
}
</script>

</body>
</html>
